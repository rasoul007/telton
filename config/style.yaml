# Visual + narration defaults for every render (override per project if needed).
video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast

colors:
  bg: "#0B0E13"
  bg2: "#161E2B"
  panel: "#101826"
  accent: "#FFD400"
  accent2: "#E10600"
  good: "#22C55E"
  text: "#FFFFFF"
  muted: "#9AA4B2"

fonts:
  black: assets/fonts/Vazirmatn-Black.ttf
  bold: assets/fonts/Vazirmatn-Bold.ttf
  regular: assets/fonts/Vazirmatn-Regular.ttf

narration:
  words_per_second: 2.9
  tail_seconds: 0.9
  min_story_seconds: 7.0
  title_card_seconds: 2.4
  max_words_per_cue: 26

branding:
  name: "تلتون اسپرت"
  handle: "@telton.sport"
  watermark_alpha: 120

ticker:
  enabled: true
  speed_px_per_second: 170
