[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telton"
version = "0.1.0"
description = "Persian sports-news video agent: collect → script → voice → render → approve → publish"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4.2",
  "imageio-ffmpeg>=0.4.9",
  "feedparser>=6.0",
  "PyYAML>=6.0",
  "edge-tts>=6.1",
  "gTTS>=2.5",
]

[project.scripts]
telton = "telton.cli:main"

[tool.setuptools.packages.find]
include = ["telton*"]
